<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeSmith</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      color: white;
      animation: fadeIn 0.5s ease-in;
    }

    .logo {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 40px;
      letter-spacing: -1px;
      animation: slideDown 0.6s ease-out;
    }

    .logo-icon {
      display: inline-flex;
      width: 52px;
      height: 52px;
      margin-right: 12px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 14px;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      letter-spacing: 0.5px;
      animation: rotate 2s linear infinite;
    }

    .loading {
      font-size: 16px;
      opacity: 0.9;
      margin-top: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }

    .status {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 10px;
      min-height: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.6; }
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .version {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="logo-icon">VS</span>
      VibeSmith
    </div>
    <div class="spinner"></div>
    <div class="loading">Starting API server...</div>
    <div class="status" id="status"></div>
  </div>
  <div class="version" id="version">v-</div>

  <script>
    let dots = 0;
    setInterval(() => {
      dots = (dots + 1) % 4;
      const status = document.getElementById('status');
      if (status) {
        status.textContent = 'Initializing' + '.'.repeat(dots);
      }
    }, 500);

    const versionElement = document.getElementById('version');
    if (versionElement) {
      const params = new URLSearchParams(window.location.search);
      const version = params.get('version');
      versionElement.textContent = version ? `v${version}` : 'v-';
    }
  </script>
</body>
</html>
