name: Backend CI
# Disabled for faster PR merges - Tests run locally
# Run manually when needed for full validation
on:
  workflow_dispatch:  # Manual trigger only

# Concurrency control: cancel previous runs when new commits are pushed on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            packages/core/pyproject.toml
            packages/api/pyproject.toml
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core[dev]
          pip install -e packages/api[dev]
      
      - name: Lint with ruff (core)
        run: |
          cd packages/core
          ruff check .
      
      - name: Lint with ruff (api)
        run: |
          cd packages/api
          ruff check .
      
      - name: Validate templates
        run: |
          python packages/core/scripts/validate_templates.py
      
      - name: Test core with pytest
        run: |
          cd packages/core
          pytest -v --cov=vibesmith_core --cov-report=xml --cov-report=term
      
      - name: Test api with pytest
        run: |
          cd packages/api
          pytest -v --cov=vibesmith_api --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/core/coverage.xml,./packages/api/coverage.xml
          flags: backend
          name: backend-${{ matrix.python-version }}
          fail_ci_if_error: false
  
  summary:
    name: Backend CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## 🐍 Backend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Jobs" >> $GITHUB_STEP_SUMMARY
          echo "- Lint & Test (Python 3.11, 3.12)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Packages Tested" >> $GITHUB_STEP_SUMMARY
          echo "- packages/core (vibesmith-core)" >> $GITHUB_STEP_SUMMARY
          echo "- packages/api (vibesmith-api)" >> $GITHUB_STEP_SUMMARY
