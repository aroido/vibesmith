name: API Docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/core/**'
      - 'scripts/generate-openapi.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: write  # Push to gh-pages branch

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy API Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            packages/core/pyproject.toml
            packages/api/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core
          pip install -e packages/api

      - name: Generate OpenAPI JSON
        run: python scripts/generate-openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build ReDoc HTML
        run: |
          mkdir -p dist/api
          cp docs/api/openapi.json dist/api/
          npx --yes @redocly/cli build-docs dist/api/openapi.json \
            --output=dist/api/index.html \
            --title="VibeSmith API"

      - name: Deploy to GitHub Pages
        id: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/api
          destination_dir: api
